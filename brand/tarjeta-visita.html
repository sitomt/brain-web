<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Sito Labs · Tarjeta de visita</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 85x55 mm + 3 mm sangrado = 91x61. Zona segura 3 mm dentro del corte. 300 dpi. */
:root{--ink:#1A1814;--cream:#FAF8F3;--mag:#F72585;--spec:linear-gradient(90deg,#4361EE,#7209B7,#F72585,#FB5607)}
*{box-sizing:border-box}
body{margin:0;background:#777;font-family:'DM Sans',sans-serif;display:flex;flex-wrap:wrap;gap:12mm;padding:12mm;-webkit-font-smoothing:antialiased}
.card{width:91mm;height:61mm;position:relative;overflow:hidden}
.guide{position:absolute;inset:3mm;border:.15mm dashed rgba(255,0,0,.4);pointer-events:none}
body.print .guide{display:none}
.sig{font-family:'Instrument Serif',serif;font-style:italic;line-height:1;display:flex;align-items:baseline;white-space:nowrap}
.sig b{font-weight:400}.sig i{display:block;border-radius:50%;background:var(--mag)}
.tile{border-radius:22%;display:flex;align-items:center;justify-content:center;flex:none}
.word{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.dot{color:var(--mag)}
.tag{font-weight:500;text-transform:uppercase;letter-spacing:.2em;line-height:1;opacity:.6}
.spec{position:absolute;left:0;right:0;bottom:0;height:1.3mm;background:var(--spec)}
/* Lockup compartido (misma proporción que sitolabs-logo-*.png) */
.lock{display:flex;align-items:center;gap:2.6mm}
.lock .tile{width:10.6mm;height:10.6mm}
.lock .sig{font-size:9.9mm;gap:.4mm;transform:translate(-2%,-6%)}.lock .sig i{width:1.3mm;height:1.3mm;margin-bottom:.15mm}
.lock .word{font-size:9.9mm}
/* ANVERSO — oscuro, solo marca + eslogan */
.front{background:var(--ink);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.3mm}
.front .tile{background:var(--cream);color:var(--ink)}
.front{gap:2mm}
.front .tag{font-size:2.6mm;text-align:center;line-height:1;opacity:1;color:rgba(250,248,243,.62)}
.front .tag .cities{display:flex;align-items:center;justify-content:center;gap:2.2mm;margin-top:1.7mm;font-size:2.3mm;letter-spacing:.3em;color:rgba(250,248,243,.85)}
.front .tag .cities i{display:block;width:6mm;height:.18mm;background:rgba(250,248,243,.3)}
.front .tag .cities b{color:var(--mag);font-weight:600;margin:0 -.6mm}
.front .slogan{position:absolute;left:0;right:0;bottom:5mm;text-align:center;font-family:'Instrument Serif',serif;font-style:italic;font-size:4.2mm;color:rgba(250,248,243,.7);letter-spacing:.005em}
/* REVERSO — crema, datos + QR. Sin logo (ya está en el anverso) */
.back{background:var(--cream);color:var(--ink)}
.back .safe{position:absolute;inset:6.5mm 7mm 7mm 7mm;display:grid;grid-template-columns:1fr auto;column-gap:5mm;grid-template-rows:auto 1fr}
.back .head{grid-column:1/3;display:flex;align-items:baseline;gap:3mm;padding-bottom:2.6mm;border-bottom:.2mm solid rgba(26,24,20,.16)}
.back .name{font-family:'Instrument Serif',serif;font-size:9.6mm;line-height:.9;letter-spacing:-.02em;white-space:nowrap}
.back .name .dot{color:var(--mag)}
.back .role{margin-left:auto;font-size:2.7mm;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(26,24,20,.6)}
.back .contact{align-self:center;display:flex;flex-direction:column;gap:2.6mm;font-size:3.7mm;font-weight:600;letter-spacing:-.005em}
.back .contact .row{display:flex;align-items:center;gap:2.2mm;white-space:nowrap;line-height:1}
.back .contact svg{width:4.4mm;height:4.4mm;flex:none}
.back .contact .web{font-weight:500}
.back .qrbox{align-self:center;display:flex;flex-direction:column;align-items:center;gap:1.6mm}
.back .qr{width:21mm;height:21mm;background:#fff;border:.2mm solid rgba(26,24,20,.16);border-radius:1.6mm;padding:1.4mm}
.back .qr svg{width:100%;height:100%;display:block}
.back .qrbox small{font-size:2.3mm;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(26,24,20,.55)}
</style></head><body>
<section class="card front" id="front"><div class="guide"></div>
  <div class="lock"><div class="tile"><div class="sig"><b>s</b><i></i></div></div><div class="word">sitolabs<span class="dot">.</span></div></div>
  <div class="tag">Inteligencia operativa<span class="cities"><i></i>Murcia<b>·</b>Roma<i></i></span></div>
  <div class="slogan">Menos fricción. Más negocio.</div>
  <div class="spec"></div>
</section>
<section class="card back" id="back"><div class="guide"></div>
  <div class="safe">
    <div class="head"><div class="name">Ginés Munuera<span class="dot">.</span></div><div class="role">Fundador</div></div>
    <div class="contact">
      <div class="row"><svg viewBox="0 0 24 24"><path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M17.2 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.8-.8-1.4-1.7-1.6-2-.2-.3 0-.4.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.1c-.2-.6-.5-.5-.6-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.7.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg><span>641 310 956</span></div>
      <div class="row"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#4361EE"/><rect x="6.5" y="8.2" width="11" height="7.6" rx="1.4" fill="#fff"/><path d="M6.5 9.6l5.5 3.6 5.5-3.6" fill="none" stroke="#4361EE" stroke-width="1.2" stroke-linejoin="round"/></svg><span>hello@sitolabs.com</span></div>
      <div class="row web"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F72585"/><g fill="none" stroke="#fff" stroke-width="1.2"><circle cx="12" cy="12" r="5.6"/><ellipse cx="12" cy="12" rx="2.4" ry="5.6"/><path d="M6.4 12h11.2M7.4 9.4h9.2M7.4 14.6h9.2"/></g></svg><span>sitolabs<span class="dot">.</span>com</span></div>
    </div>
    <div class="qrbox"><div class="qr"><svg id="qr" viewBox="0 0 29 29" shape-rendering="crispEdges"></svg></div><small>Escanea</small></div>
  </div>
  <div class="spec"></div>
</section>
<script>
// QR PLACEHOLDER (no escanea). Sustituir por QR real (vCard / página de contacto) antes de imprimir.
(function(){const N=29,svg=document.getElementById('qr');let seed=20260919;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
const m=Array.from({length:N},()=>Array(N).fill(0));const F=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const b=i===0||i===6||j===0||j===6,c=i>=2&&i<=4&&j>=2&&j<=4;m[y+i][x+j]=(b||c)?1:0}};
F(0,0);F(N-7,0);F(0,N-7);for(let i=8;i<N-8;i++){m[6][i]=i%2===0?1:0;m[i][6]=i%2===0?1:0}
const inF=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y)||x===6||y===6)continue;m[y][x]=rnd()<.47?1:0}
const ax=N-9,ay=N-9;for(let i=0;i<5;i++)for(let j=0;j<5;j++){const b=i===0||i===4||j===0||j===4;m[ay+i][ax+j]=(b||(i===2&&j===2))?1:0}
let d='';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x])d+=`M${x} ${y}h1v1h-1z`;
const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','#1A1814');svg.appendChild(p)})();
</script>
</body></html>
